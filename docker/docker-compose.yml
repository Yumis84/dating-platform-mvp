version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dating_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dating_pgadmin
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "8080:80" # http://localhost:8080
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - app-network
    depends_on:
      - postgres

  n8n:
    image: n8nio/n8n:latest
    container_name: dating_n8n
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - app-network
    depends_on:
      - postgres

  webapp:
    image: nginx:stable
    container_name: dating_webapp
    restart: unless-stopped
    ports:
      - "3000:80" # Telegram WebApp served on port 3000 locally
    volumes:
      - ../webapp:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - app-network

  adminer:
    image: adminer:latest
    container_name: dating_adminer
    restart: unless-stopped
    ports:
      - "8081:8080" # http://localhost:8081
    networks:
      - app-network
    depends_on:
      - postgres

volumes:
  db-data:
    name: dating_db_data
  n8n-data:
    name: dating_n8n_data
  pgadmin-data:
    name: dating_pgadmin_data

networks:
  app-network:
    name: dating_app_network
    driver: bridge
