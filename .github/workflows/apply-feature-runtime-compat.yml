name: Apply Verified n8n Runtime Compatibility Fixes

on:
  push:
    branches:
      - test/n8n-runtime-gate
    paths:
      - .github/workflows/apply-feature-runtime-compat.yml

permissions:
  contents: write

concurrency:
  group: apply-feature-runtime-compat
  cancel-in-progress: false

jobs:
  apply:
    name: Patch feature branch from verified runtime findings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard execution scope
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "test/n8n-runtime-gate"
          git merge-base --is-ancestor 30ab0911bae090b668c74768da0e3ea33faf6f0c HEAD
          cp tests/n8n_runtime_gate/apply_feature_runtime_compat.py /tmp/apply_feature_runtime_compat.py
          chmod 0755 /tmp/apply_feature_runtime_compat.py

      - name: Configure repository-only CI identity
        run: |
          git config user.name "dating-platform-runtime-gate"
          git config user.email "runtime-gate@users.noreply.github.com"

      - name: Patch only the approved feature HEAD
        id: feature
        run: |
          set -euo pipefail
          git fetch origin agent/man-woman-onboarding-ranking test/n8n-runtime-gate
          git checkout -B agent/man-woman-onboarding-ranking origin/agent/man-woman-onboarding-ranking

          EXPECTED="30ab0911bae090b668c74768da0e3ea33faf6f0c"
          ACTUAL="$(git rev-parse HEAD)"
          echo "feature_before=${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "Refusing to patch: feature HEAD changed from approved ${EXPECTED} to ${ACTUAL}" >&2
            exit 1
          fi

          python /tmp/apply_feature_runtime_compat.py

          mapfile -t CHANGED < <(git diff --name-only | sort)
          printf 'Changed files:\n%s\n' "${CHANGED[*]}"
          EXPECTED_FILES=(
            "docs/PROJECT_CONTEXT_TRANSFER.md"
            "n8n/workflows/profile/WF_03_AI_PROFILE_AGENT.json"
            "n8n/workflows/registration/WF_01_USER_REGISTRATION_MAN_WOMAN_DEV.json"
            "tests/test_product_flows.py"
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED_FILES[@]}" | sort)
          if [ "$(printf '%s\n' "${CHANGED[@]}")" != "$(printf '%s\n' "${EXPECTED_SORTED[@]}")" ]; then
            echo "Refusing to commit: changed-file set differs from allowlist" >&2
            printf 'Expected:\n%s\n' "${EXPECTED_SORTED[*]}" >&2
            exit 1
          fi

          python tests/test_product_flows.py
          git diff --check

          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('n8n/workflows/registration/WF_01_USER_REGISTRATION_MAN_WOMAN_DEV.json'),
              Path('n8n/workflows/profile/WF_03_AI_PROFILE_AGENT.json'),
          ]
          for path in paths:
              wf = json.loads(path.read_text(encoding='utf-8'))
              for node in wf['nodes']:
                  if node.get('type') != 'n8n-nodes-base.if':
                      continue
                  c = node['parameters']['conditions']
                  assert 'conditions' in c and 'combinator' in c
                  assert 'boolean' not in c and 'string' not in c
          wf01 = json.loads(paths[0].read_text(encoding='utf-8'))
          handoff = next(n for n in wf01['nodes'] if n['name'] == 'Handoff WOMAN Event to WF_03')
          assert handoff['parameters']['options']['response']['response']['responseFormat'] == 'autodetect'
          reply = next(n for n in wf01['nodes'] if n['name'] == 'Prepare WF_03 Reply')['parameters']['jsCode']
          assert 'JSON.parse' in reply and 'Array.isArray' in reply and 'handoff_ok' in reply
          print('Runtime-contract assertions: PASS')
          PY

          git add \
            docs/PROJECT_CONTEXT_TRANSFER.md \
            n8n/workflows/profile/WF_03_AI_PROFILE_AGENT.json \
            n8n/workflows/registration/WF_01_USER_REGISTRATION_MAN_WOMAN_DEV.json \
            tests/test_product_flows.py
          git commit -m "fix: align n8n v2 runtime contracts"
          FEATURE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:agent/man-woman-onboarding-ranking
          echo "feature_after=${FEATURE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Sync the exact corrected artifacts into the runtime-gate branch
        id: testbranch
        run: |
          set -euo pipefail
          git fetch origin test/n8n-runtime-gate agent/man-woman-onboarding-ranking
          git checkout -B test/n8n-runtime-gate origin/test/n8n-runtime-gate

          python /tmp/apply_feature_runtime_compat.py
          python tests/test_product_flows.py
          git diff --check

          mapfile -t CHANGED < <(git diff --name-only | sort)
          EXPECTED_FILES=(
            "docs/PROJECT_CONTEXT_TRANSFER.md"
            "n8n/workflows/profile/WF_03_AI_PROFILE_AGENT.json"
            "n8n/workflows/registration/WF_01_USER_REGISTRATION_MAN_WOMAN_DEV.json"
            "tests/test_product_flows.py"
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED_FILES[@]}" | sort)
          if [ "$(printf '%s\n' "${CHANGED[@]}")" != "$(printf '%s\n' "${EXPECTED_SORTED[@]}")" ]; then
            echo "Refusing test-branch sync: unexpected changed-file set" >&2
            printf 'Changed: %s\n' "${CHANGED[*]}" >&2
            exit 1
          fi

          git add \
            docs/PROJECT_CONTEXT_TRANSFER.md \
            n8n/workflows/profile/WF_03_AI_PROFILE_AGENT.json \
            n8n/workflows/registration/WF_01_USER_REGISTRATION_MAN_WOMAN_DEV.json \
            tests/test_product_flows.py
          git commit -m "test: sync verified runtime contract fixes"
          TEST_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:test/n8n-runtime-gate
          echo "test_after=${TEST_SHA}" >> "$GITHUB_OUTPUT"

      - name: Report pushed SHAs
        run: |
          echo "Feature runtime-corrected SHA: ${{ steps.feature.outputs.feature_after }}"
          echo "Runtime-gate sync SHA:       ${{ steps.testbranch.outputs.test_after }}"
          echo "No PR, merge, main, production n8n, Telegram, or shared DB action was performed."
